name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci
    - run: npm run build:json
    - run: git diff --exit-code -- component-definition.json component-models.json component-filters.json
    - run: npm run test:authoring
    - run: npm run lint
